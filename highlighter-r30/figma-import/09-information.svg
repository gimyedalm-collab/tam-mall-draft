<text x="236" fill="#666666" font-family="Pretendard" font-size="15" font-weight="400" letter-spacing="-0.18" text-anchor="start">
<tspan x="236" y="1217">폴리메틸실세스퀴옥세인, 트라이에틸헥사노인, 다이메티콘, 아이소노닐아이소노나노에이트,</tspan>
<tspan x="236" y="1240">세틸에틸헥사노에이트, 합성왁스, 합성플루오르플로고파이트, 알루미나,</tspan>
<tspan x="236" y="1263">하이드로제네이티드폴리(C6-14올레핀), 카프릴릭/카프릭트라이글리세라이드,</tspan>
<tspan x="236" y="1286">마이크로크리스탈린왁스, 솔비탄세스퀴아이소스테아레이트, 칸데릴라왁스, 실리카,</tspan>
<tspan x="236" y="1309">페녹시에탄올, 스테아랄코늄헥토라이트, 토코페릴아세테이트, 글리세릴카프릴레이트,</tspan>
<tspan x="236" y="1332">프로필렌카보네이트, 틴옥사이드, 토코페롤, 에틸헥실글리세린, 스쿠알란, 로즈힙열매오일,</tspan>
<tspan x="236" y="1355">호호바씨오일, 살구씨오일, 글리세린, 시어버터, 카나우바왁스, 알란토인, 정제수,</tspan>
<tspan x="236" y="1378">세라마이드엔피, 피토스핑고신, 비에이치티, 1,2-헥산다이올, 소듐하이알루로네이트, 마이카,</tspan>
<tspan x="236" y="1401">티타늄디옥사이드, 적색산화철</tspan>
