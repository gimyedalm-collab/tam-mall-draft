</text>
<text x="250" fill="#3D3D3D" font-family="Pretendard" font-size="20" font-weight="400" letter-spacing="-0.24" text-anchor="start">
<tspan x="250" y="1483">본 제품에 이상이 있을 경우, 공정거래위원회 고시</tspan>
<tspan x="250" y="1514">소비자 분쟁 해결 기준에 따라 보상해 드립니다.</tspan>
