</text>
<text x="250" fill="#3D3D3D" font-family="Pretendard" font-size="18" font-weight="400" letter-spacing="-0.216" text-anchor="start">
<tspan x="250" y="1567">사용 중 이상이 있는 경우 사용을 중단하고 전문가와 상담해 주세요.</tspan>
<tspan x="250" y="1598">상처가 있는 부위 등에는 사용을 자제해 주세요.</tspan>
<tspan x="250" y="1629">어린이의 손이 닿지 않는 곳에 보관하고, 직사광선을 피해 주세요.</tspan>
</text>
<text x="76" fill="#1A1A1A" font-family="Pretendard" font-size="20" font-weight="700" letter-spacing="-0.5" text-anchor="start">
<tspan x="76" y="1686">고객상담실</tspan>
</text>
