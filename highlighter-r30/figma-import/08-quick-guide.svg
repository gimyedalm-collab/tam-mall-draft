<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="860" height="1230" viewBox="0 0 860 1230">
<rect width="860" height="1230" fill="#F2F2F2" />
<rect x="335.0" y="120" width="190" height="42" rx="21" fill="none" stroke="#6F6A6B" stroke-width="1.25" />
<text x="430.0" fill="#1A1A1A" font-family="Manrope" font-size="19" font-weight="600" letter-spacing="1.33" text-anchor="middle">
<tspan x="430.0" y="146">Q &amp; A</tspan>
</text>
<text x="430.0" fill="#1A1A1A" font-family="Pretendard" font-size="28" font-weight="400" letter-spacing="-0.28" text-anchor="middle">
<tspan x="430.0" y="236">사용하기 전,</tspan>
</text>
<text x="430.0" fill="#1A1A1A" font-family="Pretendard" font-size="40" font-weight="600" letter-spacing="-1.2" text-anchor="middle">
<tspan x="430.0" y="299">알아두면 좋은 두 가지.</tspan>
</text>
<rect x="56" y="376" width="748" height="239" rx="20" fill="#ffffff" stroke="none" stroke-width="1" />
<text x="88" fill="#1A1A1A" font-family="Pretendard" font-size="27" font-weight="600" letter-spacing="-0.486" text-anchor="start">
<tspan x="88" y="430">Q  제형과 피부 위의 색이 달라 보이나요?</tspan>
</text>
<text x="88" fill="#6F6A6B" font-family="Pretendard" font-size="29" font-weight="400" letter-spacing="-0.29" text-anchor="start">
<tspan x="88" y="488">스틱의 제형색과 얇게 펴 바른 색은 다르게 보일 수 있습니다.</tspan>
<tspan x="88" y="532">제형뿐 아니라 피부 위 발색을 함께 확인해 주세요.</tspan>
</text>
<rect x="56" y="640" width="748" height="208" rx="20" fill="#ffffff" stroke="none" stroke-width="1" />
<text x="88" fill="#1A1A1A" font-family="Pretendard" font-size="27" font-weight="600" letter-spacing="-0.486" text-anchor="start">
<tspan x="88" y="694">Q  광을 더하고 싶을 때는 어떻게 바르나요?</tspan>
</text>
<text x="88" fill="#6F6A6B" font-family="Pretendard" font-size="29" font-weight="400" letter-spacing="-0.29" text-anchor="start">
<tspan x="88" y="752">처음에는 얇게 펴 바른 뒤 거울로 확인해 주세요.</tspan>
<tspan x="88" y="796">빛을 더하고 싶은 곳에만 소량씩 덧발라 주세요.</tspan>
</text>
<rect x="56" y="874" width="748" height="1" rx="0" fill="#E4DEDF" stroke="none" stroke-width="1" />
<text x="430.0" fill="#1A1A1A" font-family="Pretendard" font-size="32" font-weight="600" letter-spacing="-0.576" text-anchor="middle">
<tspan x="430.0" y="970">광대에는 넓게, 콧대에는 좁게.</tspan>
</text>
<text x="430.0" fill="#6F6A6B" font-family="Pretendard" font-size="25" font-weight="400" letter-spacing="-0.25" text-anchor="middle">
<tspan x="430.0" y="1037">빛을 더하고 싶은 곳에 소량씩.</tspan>
<tspan x="430.0" y="1077">나에게 맞는 펄 컬러로 마무리하세요.</tspan>
</text>
<g transform="translate(366.0 1136.0) scale(0.11851851851851852 0.11851851851851852)">
