name: Cafe24 candidate Safari verification
on:
  workflow_dispatch:
    inputs:
      target:
        description: Public site to verify
        type: choice
        options: [candidate, verification, production]
        default: candidate
      font_cushion:
        description: Verify the 261023 font and cushion rollout
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  safari:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      TAM_EXPECT_FONT_CUSHION: ${{ inputs.font_cushion }}
      TAM_BASE_URL: ${{ inputs.target == 'production' && 'https://tambeauty.kr/' || inputs.target == 'verification' && 'https://awiz.cafe24.com/skin-skin24/' || 'https://awiz.cafe24.com/skin-skin21/' }}
    steps:
      - uses: actions/checkout@v6
      - name: Use the Korean storefront locale on this temporary runner
        run: |
          defaults write -g AppleLanguages -array ko-KR en-US
          defaults write -g AppleLocale -string ko_KR
          defaults write com.apple.Safari AppleLanguages -array ko-KR en-US
      - run: sudo safaridriver --enable
      - run: python3 ops/cafe24/verify_native_safari.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-safari-verification
          path: native-safari-results/report.json
          retention-days: 3
